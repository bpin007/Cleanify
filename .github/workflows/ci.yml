name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TURBO_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4

      # Reads the pnpm version from package.json "packageManager".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Engine coverage (90% minimum, PROJECT.md section 20)
        run: pnpm --filter @cleanify/engine test:coverage

      - name: Build
        run: pnpm build

  e2e:
    # Playwright end-to-end tests with axe accessibility checks (PROJECT.md section 20),
    # on the production build, desktop and phone sizes.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TURBO_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for Playwright
        run: pnpm --filter @cleanify/web exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm --filter @cleanify/web test:e2e

      - name: Upload the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/test-results/
          retention-days: 7

  e2e-cloud:
    # Cloud mode against a real API (PROJECT.md section 20): anonymous jobs, uploads and
    # the signed-in flow. The API runs with NODE_ENV=test: a throwaway mongodb-memory-server
    # database and local-disk storage, no secrets needed. Pull requests into main only, so
    # pushes keep the faster browser-only e2e job.
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TURBO_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # mongodb-memory-server downloads a mongod binary on first use.
      - name: Cache the MongoDB binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Chromium for Playwright
        run: pnpm --filter @cleanify/web exec playwright install --with-deps chromium

      - name: Cloud-mode end-to-end tests
        run: pnpm --filter @cleanify/web test:e2e:cloud

      - name: Upload the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-cloud
          path: apps/web/test-results/
          retention-days: 7
